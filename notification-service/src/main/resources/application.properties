# ============================================================
# NOTIFICATION SERVICE
# Consumes Kafka alert events and logs them :8085
# (Current delivery implementation: application logs)
# ============================================================

# Application name (used for logging / service identity)
spring.application.name=notification-service

# ------------------------------------------------------------
# Kafka - consumed alert topics
#   transaction.completed      -> debit / credit alerts
#   transaction.refunded       -> refund compensation alert
#   fraud.detected             -> account blocked alert
#   transaction.otp.generated  -> OTP delivery
#   inbound.credit.received    -> money arrived via rail (UTR)
#   inbound.credit.failed      -> inbound credit could not be posted
#   outbound.transfer.sent     -> payment to another bank sent (UTR)
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

# Service listening port
server.port=8085

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

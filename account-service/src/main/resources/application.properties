# ============================================================
# ACCOUNT SERVICE
# Accounts, balances, debit/credit, blocking :8081
# ============================================================

# Application name (used for logging / service identity)
spring.application.name=account-service

# ------------------------------------------------------------
# MySQL - service-owned schema (account_db)
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update: Hibernate creates/updates tables from entities
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Kafka
# Consumer: credits receivers on intrabank.transfer.requested,
#           acks on transaction.credited / transaction.credit.failed,
#           blocks accounts on fraud.detected
# Producer: acks and fraud-block events
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=account-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Service listening port
server.port=8081

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

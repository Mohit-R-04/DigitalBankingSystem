<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Digital Banking System Architecture</title>
  <desc id="desc">Layered architecture showing the React frontend, API Gateway, Transaction, Account and Interbank services, owned MySQL schemas, Kafka event bus, Fraud Detection and Notification workers, Redis responsibilities and the inbound credit rail simulation (UPI | IMPS | NEFT).</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="kafka" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ede9fe"/>
      <stop offset=".5" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="httpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="eventArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7c3aed"/>
    </marker>
    <marker id="storeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#059669"/>
    </marker>
    <style>
      .heading{font:700 38px Arial,sans-serif;fill:#0f172a}.subheading{font:400 17px Arial,sans-serif;fill:#475569}
      .lane{fill:#fff;stroke:#d8e0eb;stroke-width:1.5;rx:24}.laneTitle{font:700 15px Arial,sans-serif;fill:#64748b;letter-spacing:1.4px}
      .node{rx:18;stroke-width:2.2;filter:url(#shadow)}.name{font:700 21px Arial,sans-serif;fill:#0f172a}.meta{font:400 14px Arial,sans-serif;fill:#475569}.tiny{font:400 12px Arial,sans-serif;fill:#64748b}.label{font:600 13px Arial,sans-serif;fill:#334155}
      .http{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#httpArrow)}.event{stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#eventArrow)}.eventBoth{stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-start:url(#eventArrow);marker-end:url(#eventArrow)}.store{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#storeArrow)}
      .dbTop{fill:#10b981}.dbBody{fill:#ecfdf5;stroke:#059669;stroke-width:2}.dbName{font:700 17px Arial,sans-serif;fill:#064e3b}.dbMeta{font:400 13px Arial,sans-serif;fill:#047857}
      .pill{rx:13;stroke-width:1.5}.pillText{font:600 12px Arial,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1800" height="1240" fill="url(#page)"/>
  <text x="65" y="60" class="heading">Digital Banking System - Architecture</text>
  <text x="65" y="91" class="subheading">Layered view of request routing, service ownership, synchronous REST calls, asynchronous Kafka events, and state</text>

  <!-- Client and edge -->
  <rect x="45" y="120" width="1710" height="180" class="lane"/>
  <text x="70" y="150" class="laneTitle">CLIENT AND API EDGE</text>
  <rect x="135" y="183" width="380" height="82" class="node" fill="#dbeafe" stroke="#2563eb"/>
  <text x="325" y="215" text-anchor="middle" class="name">React 18 + Vite Frontend</text>
  <text x="325" y="242" text-anchor="middle" class="meta">:3000 | Axios /api/v1 | Vite /api proxy</text>
  <rect x="710" y="168" width="440" height="112" class="node" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="930" y="203" text-anchor="middle" class="name">Spring Cloud API Gateway :8080</text>
  <text x="930" y="230" text-anchor="middle" class="meta">Path routing | CORS | Redis RequestRateLimiter</text>
  <text x="930" y="255" text-anchor="middle" class="tiny">IP key | accounts 10/20 | transactions 10/20 | interbank 5/10</text>
  <path d="M515 224H710" class="http"/>
  <text x="612" y="209" text-anchor="middle" class="label">REST / JSON</text>

  <!-- Services -->
  <rect x="45" y="325" width="1710" height="360" class="lane"/>
  <text x="70" y="355" class="laneTitle">BUSINESS SERVICES AND OWNED DATA</text>

  <rect x="100" y="405" width="390" height="138" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="295" y="442" text-anchor="middle" class="name">Transaction Service :8082</text>
  <text x="295" y="470" text-anchor="middle" class="meta">Transfer API | SAGA orchestration | OTP verification</text>
  <text x="295" y="496" text-anchor="middle" class="tiny">Produces and consumes transaction/fraud events</text>
  <text x="295" y="519" text-anchor="middle" class="tiny">Redis: verification:otp&lt;transactionId&gt; (5 min)</text>

  <rect x="705" y="405" width="390" height="138" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="900" y="442" text-anchor="middle" class="name">Account Service :8081</text>
  <text x="900" y="470" text-anchor="middle" class="meta">Accounts | balance | debit/credit | account status</text>
  <text x="900" y="496" text-anchor="middle" class="tiny">Consumes transaction.credit.requested and fraud.detected</text>
  <text x="900" y="519" text-anchor="middle" class="tiny">Only service that persists account balance changes</text>

  <rect x="1310" y="405" width="390" height="138" class="node" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1505" y="442" text-anchor="middle" class="name">Interbank Service :8083</text>
  <text x="1505" y="470" text-anchor="middle" class="meta">Simulates the rail (UPI | IMPS | NEFT)</text>
  <text x="1505" y="496" text-anchor="middle" class="tiny">Feign credit to Account Service | record ledger entry to Transaction Service</text>
  <text x="1505" y="519" text-anchor="middle" class="tiny">Produces inbound.credit.* | outbound.transfer.sent | no storage</text>

  <!-- Gateway routes: separate vertical branches -->
  <path d="M880 280V342H295V405" class="http"/>
  <text x="430" y="337" class="label">/api/v1/transactions/**</text>
  <path d="M930 280V405" class="http"/>
  <text x="945" y="365" class="label">/accounts/**</text>
  <path d="M980 280V342H1505V405" class="http"/>
  <text x="1265" y="337" class="label">/api/v1/interbank/**</text>

  <!-- Feign calls, non-overlapping horizontal -->
  <path d="M490 455H705" class="http"/>
  <text x="598" y="438" text-anchor="middle" class="label">Feign: deduct / refund</text>
  <path d="M1310 500H1095" class="http"/>
  <text x="1202" y="525" text-anchor="middle" class="label">Feign: credit inbound amount</text>

  <!-- Other banks (external) -->
  <rect x="1475" y="565" width="225" height="80" class="node" fill="#fce7f3" stroke="#db2777"/>
  <text x="1588" y="597" text-anchor="middle" class="name">Other banks</text>
  <text x="1588" y="622" text-anchor="middle" class="meta">UPI | IMPS | NEFT rails</text>
  <path d="M1505 543V565" class="http"/>

  <!-- Owned databases -->
  <g transform="translate(120 570)">
    <ellipse cx="175" cy="13" rx="175" ry="13" class="dbTop"/>
    <rect x="0" y="13" width="350" height="57" class="dbBody"/>
    <ellipse cx="175" cy="70" rx="175" ry="13" class="dbBody"/>
    <text x="175" y="43" text-anchor="middle" class="dbName">transaction_db.transactions</text>
    <text x="175" y="64" text-anchor="middle" class="dbMeta">MySQL 8 | service-owned schema</text>
  </g>
  <g transform="translate(725 570)">
    <ellipse cx="175" cy="13" rx="175" ry="13" class="dbTop"/>
    <rect x="0" y="13" width="350" height="57" class="dbBody"/>
    <ellipse cx="175" cy="70" rx="175" ry="13" class="dbBody"/>
    <text x="175" y="43" text-anchor="middle" class="dbName">account_db.accounts</text>
    <text x="175" y="64" text-anchor="middle" class="dbMeta">MySQL 8 | service-owned schema</text>
  </g>
  <path d="M295 543V570" class="store"/>
  <path d="M900 543V570" class="store"/>

  <!-- Kafka bus -->
  <rect x="45" y="710" width="1710" height="165" class="lane"/>
  <text x="70" y="740" class="laneTitle">ASYNCHRONOUS EVENT BACKBONE</text>
  <rect x="160" y="770" width="1480" height="72" rx="20" fill="url(#kafka)" stroke="#7c3aed" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="900" y="800" text-anchor="middle" class="name">Apache Kafka :29092 (application) / :9092 (host)</text>
  <text x="900" y="825" text-anchor="middle" class="meta">transaction.* | fraud.* | verification.required | inbound.credit.* | outbound.transfer.sent | JSON messages | separate consumer groups</text>

  <!-- Clear event ports around DBs -->
  <path d="M100 500H78V806H160" class="eventBoth"/>
  <path d="M1095 455H1125V735H600V770" class="event"/>
  <text x="815" y="728" text-anchor="middle" class="tiny">Account consumes credit requests / fraud blocks</text>
  <path d="M1700 500H1722V806H1640" class="event"/>

  <!-- Workers -->
  <rect x="45" y="900" width="1710" height="260" class="lane"/>
  <text x="70" y="930" class="laneTitle">EVENT WORKERS AND SHARED TEMPORARY STATE</text>
  <rect x="135" y="980" width="420" height="120" class="node" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="345" y="1017" text-anchor="middle" class="name">Fraud Detection Service :8084</text>
  <text x="345" y="1045" text-anchor="middle" class="meta">Consumes transaction.initiated</text>
  <text x="345" y="1070" text-anchor="middle" class="tiny">Feign GET Account balance | publishes clean / verification</text>

  <rect x="690" y="980" width="420" height="120" class="node" fill="#ffedd5" stroke="#ea580c"/>
  <text x="900" y="1017" text-anchor="middle" class="name">Redis :6379</text>
  <text x="900" y="1045" text-anchor="middle" class="meta">Gateway rate-limit buckets | Transaction OTP</text>
  <text x="900" y="1070" text-anchor="middle" class="tiny">Fraud velocity counters + running amount values</text>

  <rect x="1245" y="980" width="420" height="120" class="node" fill="#cffafe" stroke="#0891b2"/>
  <text x="1455" y="1017" text-anchor="middle" class="name">Notification Service :8085</text>
  <text x="1455" y="1045" text-anchor="middle" class="meta">Consumes seven alert topics</text>
  <text x="1455" y="1070" text-anchor="middle" class="tiny">Current delivery implementation: application logs</text>

  <path d="M345 980V842" class="eventBoth"/>
  <text x="360" y="912" class="tiny">consume / publish</text>
  <path d="M1455 842V980" class="event"/>
  <text x="1470" y="912" class="tiny">consume</text>

  <!-- Fraud-to-Account balance lookup is stated inside the Fraud node to avoid a cross-layer connector. -->

  <!-- Redis clients summarized without crossing lines -->
  <rect x="735" y="1115" width="330" height="27" class="pill" fill="#fff7ed" stroke="#fb923c"/>
  <text x="900" y="1133" text-anchor="middle" class="pillText">Shared by Gateway, Transaction, and Fraud services</text>

  <!-- Legend -->
  <path d="M70 1200H115" class="http"/>
  <text x="128" y="1205" class="label">Synchronous HTTP / OpenFeign</text>
  <path d="M430 1200H475" class="event"/>
  <text x="488" y="1205" class="label">Asynchronous Kafka event</text>
  <path d="M760 1200H805" class="store"/>
  <text x="818" y="1205" class="label">Owned persistent storage</text>
  <rect x="1100" y="1185" width="620" height="34" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1410" y="1207" text-anchor="middle" class="tiny">Fraud and Notification expose no business REST API; they operate through Kafka.</text>
</svg>

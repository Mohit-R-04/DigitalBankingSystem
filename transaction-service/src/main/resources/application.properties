# ============================================================
# TRANSACTION SERVICE
# Transfers, SAGA orchestration, OTP verification :8082
# ============================================================

# Application name (used for logging / service identity)
spring.application.name=transaction-service

# ------------------------------------------------------------
# MySQL - service-owned schema (transaction_db)
# Contains transactions + idempotency_records (unique key lock)
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Kafka - the SAGA event bus
# Produces:  transaction.initiated, intrabank.transfer.requested,
#            interbank.transfer.requested, transaction.completed,
#            transaction.refunded, fraud.detected, transaction.otp.generated
# Consumes:  fraud.check.clean, verification.required, transaction.credited,
#            transaction.credit.failed, interbank.transfer.completed
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ------------------------------------------------------------
# Redis - OTP store
# Keys: verification:otp{transactionId} (TTL 5 min)
# ------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Service listening port
server.port=8082

# Account Service URL for Feign Client (debit / credit / balance)
account.service.url=http://localhost:8081

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

# ============================================================
# API GATEWAY
# Spring Cloud Gateway :8080 - single entry point for the bank
# ============================================================

# Application name (used for logging / service identity)
spring.application.name=api-gateway

# ------------------------------------------------------------
# Redis - backing store for the RequestRateLimiter token buckets
# ------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ------------------------------------------------------------
# CORS - which browser origins may call the gateway
# (the React frontends run on 3000 / 3001)
# ------------------------------------------------------------
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-origins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-origins[1]=http://localhost:3001
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allow-credentials=true

# ------------------------------------------------------------
# Account Service route
# replenishRate = tokens refilled per second (10)
# burstCapacity = max token bucket size / allowed burst (20)
# KeyResolver keys the bucket by client IP (RateLimiterConfig)
# ------------------------------------------------------------
spring.cloud.gateway.routes[0].id=account-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/accounts/**
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20

# ------------------------------------------------------------
# Transaction Service route
# Same token-bucket limits: burst up to 20, then 10 req/sec
# ------------------------------------------------------------
spring.cloud.gateway.routes[1].id=transaction-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/transactions/**
spring.cloud.gateway.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=20

# NOTE: the Interbank Service has no gateway route - it is an
# internal, Kafka-driven service (see interbank.transfer.requested).

# Gateway listening port
server.port=8080

# Actuator endpoints (gateway endpoint exposes live route list)
management.endpoints.web.exposure.include=health,info,gateway

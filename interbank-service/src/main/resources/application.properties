# ============================================================
# INTERBANK SERVICE
# Simulated rail (UPI / IMPS / NEFT switch) :8083
# Internal service - no API gateway route.
# Outbound transfers arrive via Kafka (interbank.transfer.requested);
# the inbound-credit simulator is called directly on :8083.
# ============================================================

# Application name (used for logging / service identity)
spring.application.name=interbank-service

# ------------------------------------------------------------
# Kafka
# Consumes: interbank.transfer.requested (from Transaction Service)
# Produces: interbank.transfer.completed (UTR or failure),
#           outbound.transfer.sent, inbound.credit.received,
#           inbound.credit.failed
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=interbank-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

# Service listening port (direct calls only - not routed via gateway)
server.port=8083

# Account Service URL for Feign Client (credit inbound money)
account.service.url=http://localhost:8081

# Transaction Service URL for Feign Client (record ledger entry)
transaction.service.url=http://localhost:8082

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

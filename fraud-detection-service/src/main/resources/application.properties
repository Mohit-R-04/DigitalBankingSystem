# ============================================================
# FRAUD DETECTION SERVICE
# Kafka-based fraud checks for transfers :8084
# ============================================================

# Application name (used for logging / service identity)
spring.application.name=fraud-detection-service

# ------------------------------------------------------------
# Redis - velocity counters + running average per account
# Keys: fraud:velocity{accountNumber}, fraud:avg_amount{accountNumber}
# ------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ------------------------------------------------------------
# Kafka
# Consumes: transaction.initiated (new transfer to check)
# Produces: fraud.check.clean, verification.required (OTP step-up)
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fraud-detection-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Service listening port
server.port=8084

# Account Service URL for Feign Client (balance check - Pattern 3)
account.service.url=http://localhost:8081

# ------------------------------------------------------------
# Fraud Detection Rules
# ------------------------------------------------------------
# Max transfers an account can make per minute before suspicion
fraud.max-transactions-per-minute=5
# Amount is suspicious when it exceeds this x the account's average
fraud.suspicious-amount-multiplier=3.0
# Max share of balance a single transfer may consume (0.90 = 90%)
fraud.max-balance-percentage=0.90

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
